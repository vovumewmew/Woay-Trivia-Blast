<svg width="450" height="130" viewBox="0 0 450 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="rgba(0,0,0,0.5)" result="colorBlur"/>
      <feComposite in="colorBlur" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g font-family="sans-serif" font-weight="900" font-style="italic" letter-spacing="0.05em" filter="url(#shadow)">
    <text x="10" y="70" font-size="72" fill="#FFFFFF">WOAY</text>
    <text x="240" y="70" font-size="36" fill="#FACC15">TRIVIA</text> <text x="240" y="110" font-size="42" fill="#EA580C">BLAST</text>  </g>
</svg>